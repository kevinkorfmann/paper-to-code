name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Check the reference interpreter
        run: python -c "import platform; assert platform.python_version() == '3.14.5'; assert platform.python_implementation() == 'CPython'"
      - name: Run mathematical, numerical, CLI, and sample-output tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s examples/gated_attention -v
          python -m unittest discover -s examples/multi_head_attention_residuals -v
          python -m unittest discover -s examples/attention_abstention -v
          python -m unittest discover -s examples/first_passage_attention -v
          python -m unittest discover -s examples/tail_proxy_attention -v
          python -m unittest discover -s examples/continuum_attention -v
          python -m unittest discover -s examples/merlin_routing -v
          python -m unittest discover -s examples/kronecker_delta -v
      - name: Reproduce the checked output byte for byte
        run: |
          python -m examples.differential_attention.demo > /tmp/attention-output.json
          diff -u examples/differential_attention/sample_output.json /tmp/attention-output.json
          python -m examples.gated_attention.demo > /tmp/gated-output.json
          diff -u examples/gated_attention/sample_output.json /tmp/gated-output.json
          python -m examples.multi_head_attention_residuals.demo > /tmp/mhar-output.json
          diff -u examples/multi_head_attention_residuals/sample_output.json /tmp/mhar-output.json
          python -m examples.attention_abstention.demo > /tmp/abstention-output.json
          diff -u examples/attention_abstention/sample_output.json /tmp/abstention-output.json
          python -m examples.first_passage_attention.demo > /tmp/fpa-output.json
          diff -u examples/first_passage_attention/sample_output.json /tmp/fpa-output.json
          python -m examples.tail_proxy_attention.demo > /tmp/tail-proxy-output.json
          diff -u examples/tail_proxy_attention/sample_output.json /tmp/tail-proxy-output.json
          python -m examples.continuum_attention.demo > /tmp/continuum-output.json
          diff -u examples/continuum_attention/sample_output.json /tmp/continuum-output.json
          python -m examples.merlin_routing.demo > /tmp/merlin-output.json
          diff -u examples/merlin_routing/sample_output.json /tmp/merlin-output.json
          python -m examples.kronecker_delta.demo > /tmp/kronecker-output.json
          diff -u examples/kronecker_delta/sample_output.json /tmp/kronecker-output.json

  slimulations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Build the checksum-verified official SLiM 4.0.1 CLI
        run: |
          curl --fail --silent --show-error --location \
            https://codeload.github.com/MesserLab/SLiM/tar.gz/09fcf604a06307cf75098dfa0a2171a9b7852216 \
            --output "$RUNNER_TEMP/slim.tar.gz"
          echo "e2448f4aaca909ffdfb33690f0d1dea2a102c2ef1b71373d72661c31df29b481  $RUNNER_TEMP/slim.tar.gz" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/slim-source"
          tar -xzf "$RUNNER_TEMP/slim.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/slim-source"
          cmake -S "$RUNNER_TEMP/slim-source" -B "$RUNNER_TEMP/slim-build" \
            -DBUILD_SLIMGUI=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_FLAGS="-include cstdint"
          cmake --build "$RUNNER_TEMP/slim-build" --target slim --parallel 2
          echo "$RUNNER_TEMP/slim-build" >> "$GITHUB_PATH"
      - name: Run SLiM integration and analytical checks
        run: |
          slim -v
          python -m unittest discover -s examples/slimulations/neutral_drift -v
          python -m examples.slimulations.neutral_drift.demo > /tmp/slim-summary.json
          diff -u examples/slimulations/neutral_drift/sample_summary.json /tmp/slim-summary.json
          python -m unittest discover -s examples/slimulations/migration -v
          python -m examples.slimulations.migration.demo > /tmp/migration-summary.json
          diff -u examples/slimulations/migration/sample_summary.json /tmp/migration-summary.json
          python -m unittest discover -s examples/slimulations/selfing -v
          python -m examples.slimulations.selfing.demo > /tmp/selfing-summary.json
          diff -u examples/slimulations/selfing/sample_summary.json /tmp/selfing-summary.json
          python -m unittest discover -s examples/slimulations/heterozygote_advantage -v
          python -m examples.slimulations.heterozygote_advantage.demo > /tmp/selection-summary.json
          diff -u examples/slimulations/heterozygote_advantage/sample_summary.json /tmp/selection-summary.json
          python -m unittest discover -s examples/slimulations/linkage_disequilibrium -v
          python -m examples.slimulations.linkage_disequilibrium.demo > /tmp/ld-summary.json
          diff -u examples/slimulations/linkage_disequilibrium/sample_summary.json /tmp/ld-summary.json
          python -m unittest discover -s examples/slimulations/wahlund_effect -v
          python -m examples.slimulations.wahlund_effect.demo > /tmp/wahlund-summary.json
          diff -u examples/slimulations/wahlund_effect/sample_summary.json /tmp/wahlund-summary.json
          python -m unittest discover -s examples/slimulations/recessive_selection -v
          python -m examples.slimulations.recessive_selection.demo --check-sample
          python -m unittest discover -s examples/slimulations/transmission_distortion -v
          python -m examples.slimulations.transmission_distortion.demo --check-sample

  inference-showcase:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: examples/inference_showcase/tsinfer_genealogy/.python-version
      - name: Install the isolated hash-locked inference environment
        run: |
          python -c "import platform; assert platform.python_version() == '3.12.11'"
          python -m pip install --no-cache-dir --require-hashes \
            -r examples/inference_showcase/tsinfer_genealogy/requirements.lock
      - name: Run genuine inference and compare checked synthetic input/output
        run: |
          python -m unittest discover -s examples/inference_showcase/tsinfer_genealogy -v
          python -m examples.inference_showcase.tsinfer_genealogy.demo > /tmp/inference-summary.json
          diff -u examples/inference_showcase/tsinfer_genealogy/sample_summary.json /tmp/inference-summary.json

  tsdate-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TSDATE_ENABLE_NUMBA_CACHE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: examples/inference_showcase/tsdate_clock/.python-version
      - name: Install the isolated hash-locked dating environment
        run: |
          python -c "import platform; assert platform.python_version() == '3.12.11'"
          python -m pip install --no-cache-dir --require-hashes \
            -r examples/inference_showcase/tsdate_clock/requirements.lock
      - name: Run actual dating, clock sensitivity, and checked-output tests
        run: |
          python -m unittest discover -s examples/inference_showcase/tsdate_clock -v
          python -m examples.inference_showcase.tsdate_clock.demo --check-sample

  dadi-size-change:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/paper-to-code-matplotlib
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: examples/inference_showcase/dadi_size_change/.python-version
      - name: Install the isolated hash-locked dadi environment
        run: |
          python -c "import platform; assert platform.python_version() == '3.12.11'"
          python -m pip install --no-cache-dir --require-hashes \
            -r examples/inference_showcase/dadi_size_change/requirements.lock
      - name: Fit synthetic counts and verify mathematical and numerical controls
        run: |
          python -m unittest discover -s examples/inference_showcase/dadi_size_change -v
          python -m examples.inference_showcase.dadi_size_change.demo --check-sample

  fastdfe-gamma:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/paper-to-code-fastdfe-matplotlib
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: examples/inference_showcase/fastdfe_gamma/.python-version
      - name: Install the isolated hash-locked fastDFE environment
        run: |
          python -c "import platform; assert platform.python_version() == '3.12.11'"
          python -m pip install --no-cache-dir --require-hashes \
            -r examples/inference_showcase/fastdfe_gamma/requirements.lock
      - name: Infer the synthetic DFE and verify controls and checked output
        run: |
          python -m unittest discover -s examples/inference_showcase/fastdfe_gamma -v
          python -m examples.inference_showcase.fastdfe_gamma.demo --check-sample

  scikit-allel-fst:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: examples/inference_showcase/scikit_allel_fst/.python-version
      - name: Install the isolated hash-locked scikit-allel environment
        run: |
          python -c "import platform; assert platform.python_version() == '3.12.11'"
          python -m pip install --no-cache-dir --require-hashes \
            -r examples/inference_showcase/scikit_allel_fst/requirements.lock
      - name: Estimate differentiation and verify independent controls and output
        run: |
          python -m unittest discover -s examples/inference_showcase/scikit_allel_fst -v
          python -m examples.inference_showcase.scikit_allel_fst.demo --check-sample

  moments-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: examples/inference_showcase/moments_migration/.python-version
      - name: Install the isolated hash-locked moments environment
        run: |
          python -c "import platform; assert platform.python_version() == '3.12.11'"
          python -m pip install --no-cache-dir --require-hashes \
            -r examples/inference_showcase/moments_migration/requirements.lock
      - name: Infer migration and check independent oracles and numerical controls
        run: |
          python -m unittest discover -s examples/inference_showcase/moments_migration -v
          python -m examples.inference_showcase.moments_migration.demo --check-sample

  hmmibd-tracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: examples/inference_showcase/hmmibd_tracts/.python-version
      - name: Build the checksum-verified external hmmIBD CLI
        run: |
          python -c "import platform; assert platform.python_version() == '3.14.5'"
          cc --version
          python -m examples.inference_showcase.hmmibd_tracts.build
      - name: Infer haploid IBD and check independent oracles and synthetic output
        run: |
          python -m unittest discover -s examples/inference_showcase/hmmibd_tracts -v
          python -m examples.inference_showcase.hmmibd_tracts.demo --check-sample

  plink-king:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: examples/inference_showcase/plink_king/.python-version
      - name: Install the checksum-pinned official PLINK 2 binary
        run: |
          python -c "import platform; assert platform.python_version() == '3.14.5'"
          python -m examples.inference_showcase.plink_king.install
      - name: Infer kinship and verify exact Mendelian controls and output
        run: |
          python -m unittest discover -s examples/inference_showcase/plink_king -v
          python -m examples.inference_showcase.plink_king.demo --check-sample
