name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Check the reference interpreter
        run: python -c "import platform; assert platform.python_version() == '3.14.5'; assert platform.python_implementation() == 'CPython'"
      - name: Run mathematical, numerical, CLI, and sample-output tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s examples/gated_attention -v
      - name: Reproduce the checked output byte for byte
        run: |
          python -m examples.differential_attention.demo > /tmp/attention-output.json
          diff -u examples/differential_attention/sample_output.json /tmp/attention-output.json
          python -m examples.gated_attention.demo > /tmp/gated-output.json
          diff -u examples/gated_attention/sample_output.json /tmp/gated-output.json

  slimulations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Build the checksum-verified official SLiM 4.0.1 CLI
        run: |
          curl --fail --silent --show-error --location \
            https://codeload.github.com/MesserLab/SLiM/tar.gz/09fcf604a06307cf75098dfa0a2171a9b7852216 \
            --output "$RUNNER_TEMP/slim.tar.gz"
          echo "e2448f4aaca909ffdfb33690f0d1dea2a102c2ef1b71373d72661c31df29b481  $RUNNER_TEMP/slim.tar.gz" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/slim-source"
          tar -xzf "$RUNNER_TEMP/slim.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/slim-source"
          cmake -S "$RUNNER_TEMP/slim-source" -B "$RUNNER_TEMP/slim-build" \
            -DBUILD_SLIMGUI=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_FLAGS="-include cstdint"
          cmake --build "$RUNNER_TEMP/slim-build" --target slim --parallel 2
          echo "$RUNNER_TEMP/slim-build" >> "$GITHUB_PATH"
      - name: Run SLiM integration and analytical checks
        run: |
          slim -v
          python -m unittest discover -s examples/slimulations/neutral_drift -v
          python -m examples.slimulations.neutral_drift.demo > /tmp/slim-summary.json
          diff -u examples/slimulations/neutral_drift/sample_summary.json /tmp/slim-summary.json
          python -m unittest discover -s examples/slimulations/migration -v
          python -m examples.slimulations.migration.demo > /tmp/migration-summary.json
          diff -u examples/slimulations/migration/sample_summary.json /tmp/migration-summary.json

  inference-showcase:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: examples/inference_showcase/tsinfer_genealogy/.python-version
      - name: Install the isolated hash-locked inference environment
        run: |
          python -c "import platform; assert platform.python_version() == '3.12.11'"
          python -m pip install --no-cache-dir --require-hashes \
            -r examples/inference_showcase/tsinfer_genealogy/requirements.lock
      - name: Run genuine inference and compare checked synthetic input/output
        run: |
          python -m unittest discover -s examples/inference_showcase/tsinfer_genealogy -v
          python -m examples.inference_showcase.tsinfer_genealogy.demo > /tmp/inference-summary.json
          diff -u examples/inference_showcase/tsinfer_genealogy/sample_summary.json /tmp/inference-summary.json

  tsdate-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TSDATE_ENABLE_NUMBA_CACHE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: examples/inference_showcase/tsdate_clock/.python-version
      - name: Install the isolated hash-locked dating environment
        run: |
          python -c "import platform; assert platform.python_version() == '3.12.11'"
          python -m pip install --no-cache-dir --require-hashes \
            -r examples/inference_showcase/tsdate_clock/requirements.lock
      - name: Run actual dating, clock sensitivity, and checked-output tests
        run: |
          python -m unittest discover -s examples/inference_showcase/tsdate_clock -v
          python -m examples.inference_showcase.tsdate_clock.demo --check-sample
